name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        run: flutter build apk --release

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "v0.1.6" ]; then
            gh release delete "v0.1.7" -y --cleanup-tag >/dev/null 2>&1 || true
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "SiegeConnect $GITHUB_REF_NAME" --notes "SiegeConnect release build."
          cp "build/app/outputs/flutter-apk/app-release.apk" "SiegeConnect-Android.apk"
          gh release delete-asset "$GITHUB_REF_NAME" "app-release.apk" -y >/dev/null 2>&1 || true
          gh release upload "$GITHUB_REF_NAME" \
            "SiegeConnect-Android.apk" \
            --clobber
