name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build setup
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Mihomo
        shell: pwsh
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/install-mihomo.ps1

      - name: Build setup
        shell: pwsh
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/package-windows-setup.ps1

      - name: Create zip fallbacks
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/SiegeConnect-Windows-Portable.zip" `
            -Force
          Compress-Archive `
            -Path "dist/SiegeConnect-Setup.exe" `
            -DestinationPath "dist/SiegeConnect-Setup.zip" `
            -Force

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME `
              --title "SiegeConnect $env:GITHUB_REF_NAME - Deep Link + DNS" `
              --notes-file RELEASE_NOTES.md `
              --latest
          }
          gh release edit $env:GITHUB_REF_NAME `
            --title "SiegeConnect $env:GITHUB_REF_NAME - Deep Link + DNS" `
            --notes-file RELEASE_NOTES.md
          gh release upload $env:GITHUB_REF_NAME `
            "dist/SiegeConnect-Setup.exe#SiegeConnect-Setup.exe" `
            "dist/SiegeConnect-Setup.zip#SiegeConnect-Setup.zip" `
            "dist/SiegeConnect-Windows-Portable.zip#SiegeConnect-Windows-Portable.zip" `
            --clobber
