name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build setup
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Mihomo
        shell: pwsh
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/install-mihomo.ps1

      - name: Build setup
        shell: pwsh
        run: powershell.exe -ExecutionPolicy Bypass -File scripts/package-windows-setup.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME `
              --title "SiegeConnect $env:GITHUB_REF_NAME" `
              --notes "Windows setup build for SiegeConnect." `
              --latest
          }
          gh release upload $env:GITHUB_REF_NAME `
            "dist/SiegeConnect-Setup.exe#SiegeConnect-Setup.exe" `
            --clobber
